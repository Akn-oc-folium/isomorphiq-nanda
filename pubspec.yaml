name: isomorph_iq_nanda
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  stacked: ^3.4.4
  stacked_services: ^1.1.0
  url_strategy: ^0.3.0
  responsive_builder: ^0.7.0
  flutter_animate: ^4.1.1+1
  telegram_web_app: ^0.3.2
  gif: ^2.3.0
  url_launcher_web: ^2.4.0
  flutter_svg: ^2.0.17
  firebase_core: ^3.10.1
  dio: ^5.8.0+1
  flutter_screenutil: ^5.9.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_gen_core: ^5.9.0
  web: ^1.1.1
  focus_detector_v2: ^3.1.0+1
  crypto: ^3.0.6

dev_dependencies:
  build_runner: ^2.4.5
  flutter_gen_runner: ^5.8.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
    - assets/gifs/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora/Sora-Regular.ttf
        - asset: assets/fonts/Sora/Sora-SemiBold.ttf
          weight: 600

    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree/Figtree-Light.ttf
          weight: 300
